<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caffè del Barrio · Menù</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,300;0,400;0,600;1,300&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  /* Caffè del Barrio: nero pieno e bianco come il logo, display geometrico sottile. Colonna unica mobile-first, nav a sezioni fissa in alto. */
  --ink: #000000;
  --panel: #111111;
  --line: #2b2b2b;
  --paper: #ffffff;
  --muted: #a3a3a3;
  --brass: #ffffff;
  --display: "Josefin Sans", "Futura", "Century Gothic", system-ui, sans-serif;
  --body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--ink);
  color: var(--paper);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 640px; margin: 0 auto; padding: 0 18px 64px; }

header { padding: 40px 0 22px; text-align: center; display: grid; gap: 6px; }
header .kicker { font-size: 11px; letter-spacing: .28em; text-transform: uppercase; color: var(--brass); }
header h1 { margin: 0; }
header .logo { display: block; width: min(220px, 60vw); height: auto; margin: 0 auto; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
header p { margin: 4px auto 0; color: var(--muted); max-width: 40ch; font-size: 14px; }
.rule { display: flex; align-items: center; gap: 10px; justify-content: center; color: var(--brass); margin-top: 10px; }
.rule::before, .rule::after { content: ""; height: 1px; width: 60px; background: var(--brass); opacity: .5; }

.controls {
  position: sticky; top: 0; z-index: 5; background: var(--ink);
  padding: 10px 0 12px; border-bottom: 1px solid var(--line); display: grid; gap: 10px;
}
.search {
  width: 100%; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--panel); color: var(--paper); font: inherit;
}
.search::placeholder { color: var(--muted); }
.search:focus-visible, .chip:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; border: 1px solid var(--line); background: transparent; color: var(--paper);
  font: 500 13px var(--body); padding: 7px 13px; border-radius: 999px; cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--brass); border-color: var(--brass); color: var(--ink); }

section { padding-top: 30px; scroll-margin-top: 120px; }
section > h2 {
  font-family: var(--display); font-weight: 300; font-size: 24px; letter-spacing: .04em; text-transform: uppercase; margin: 0;
  display: flex; align-items: baseline; gap: 12px;
}
section > h2 .n { font-family: var(--body); font-size: 12px; color: var(--brass); letter-spacing: .1em; }
section > .sub { margin: 2px 0 10px; color: var(--muted); font-size: 13.5px; }

.item { padding: 14px 0; border-bottom: 1px dashed var(--line); display: grid; gap: 4px; }
.item:last-child { border-bottom: 0; }
.item .top { display: flex; align-items: baseline; gap: 10px; }
.item h3 { font-family: var(--display); font-size: 20px; font-weight: 400; letter-spacing: .02em; margin: 0; }
.item .dots { flex: 1; border-bottom: 1px dotted var(--line); transform: translateY(-5px); }
.item .glass { font-size: 11.5px; color: var(--paper); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
.item .price { font-family: var(--display); font-size: 20px; font-weight: 400; color: var(--brass); font-variant-numeric: tabular-nums; white-space: nowrap; }
.item .price::before { content: "€ "; font-size: 14px; }
.item .ing { color: var(--muted); font-size: 14px; margin: 0; }
.item .note { font-family: var(--display); font-style: italic; font-weight: 300; font-size: 16px; margin: 0; color: var(--paper); opacity: .85; }
.sizes { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin-top: 6px; }
.size { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; display: grid; gap: 2px; text-align: center; color: var(--muted); font-size: 13px; }
.size .price { font-size: 19px; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
.tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.tag.zero { border-color: var(--paper); color: var(--paper); }
.tag.strong { border-color: var(--paper); color: var(--paper); }

.list { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; }
.list .item h3 { font-size: 19px; }
@media (max-width: 420px) { .list { grid-template-columns: 1fr; } }

.empty { display: none; text-align: center; color: var(--muted); padding: 40px 0; }
footer { margin-top: 40px; text-align: center; color: var(--muted); font-size: 12.5px; }
.hidden { display: none !important; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><img class="logo" src="logo.png" alt="Caffè del Barrio, cocktails &amp; bar" width="434" height="434"><span class="sr-only">Caffè del Barrio</span></h1>
    <div class="kicker">Drink list</div>
    <p>Cocktail, gin tonic, spritz, birre e amari.</p>
    <div class="rule">✦</div>
  </header>

  <div class="controls">
    <label for="q" class="hidden">Cerca nel menù</label>
    <input id="q" class="search" type="search" placeholder="Cerca un drink o un ingrediente (es. gin, menta)">
    <nav class="chips" id="chips" aria-label="Sezioni del menù"></nav>
  </div>

  <main id="menu"></main>
  <p class="empty" id="empty">Nessun drink corrisponde alla ricerca. Prova con un altro ingrediente.</p>

  <footer>Prezzi in euro.<br>Chiedi pure al barman per varianti o drink senza alcol.</footer>
</div>

<script>
const MENU = [
  { id: "cocktail", title: "Cocktail", sub: "I classici del bancone", items: [
    { n: "Negroni", p: 8, g: "Old fashioned", i: "Gin, Campari, Vermouth rosso, scorza d'arancia", t: ["forte"] },
    { n: "Americano", p: 8, g: "Old fashioned", i: "Campari, Vermouth rosso, soda, arancia", t: [] },
    { n: "Boulevardier", p: 10, g: "Old fashioned", i: "Bourbon, Campari, Vermouth rosso", t: ["forte"] },
    { n: "Campari shakerato", p: 8, g: "Coppetta", i: "Campari shakerato con ghiaccio", t: [] },
    { n: "Margarita", p: 8, g: "Coppetta", i: "Tequila, Triple Sec, lime, bordo di sale", t: [] },
    { n: "Daiquiri", p: 8, g: "Coppetta", i: "Rum, lime, zucchero", t: [] },
    { n: "Mojito", p: 7, g: "Highball", i: "Rum bianco, menta fresca, lime, zucchero di canna, soda", t: [] },
    { n: "Cuba Libre", p: 7, g: "Highball", i: "Rum, Coca Cola, lime", t: [] },
    { n: "Gin Fizz", p: 7, g: "Highball", i: "Gin, limone, zucchero, soda", t: [] },
    { n: "Blue Lagoon", p: 7, g: "Highball", i: "Vodka, Blue Curaçao, lemon soda", t: [] },
    { n: "Piña Colada", p: 8, g: "Tumbler", i: "Rum, ananas, crema di cocco", t: [] },
    { n: "Tequila Sunrise", p: 8, g: "Highball", i: "Tequila, succo d'arancia, granatina", t: [] },
    { n: "Cocktail analcolico", p: 6, i: "Chiedi al barman la proposta del giorno", t: ["zero"] },
  ]},
  { id: "spritz", title: "Spritz e aperitivi", sub: "Per iniziare la serata", items: [
    { n: "Aperol Spritz", p: 5, g: "Calice", i: "Aperol, Prosecco, soda, arancia", t: [] },
    { n: "Campari Spritz", p: 5, g: "Calice", i: "Campari, Prosecco, soda, arancia", t: [] },
    { n: "Cynar Spritz", p: 5, g: "Calice", i: "Cynar, Prosecco, soda, limone", t: [] },
    { n: "Hugo", p: 5, g: "Calice", i: "Sciroppo di sambuco, Prosecco, soda, menta, lime", t: [] },
    { n: "Hugo Rosa", p: 5, g: "Calice", i: "La versione rosa dell'Hugo", t: [] },
    { n: "Campari e Prosecco", p: 3.5, i: "", t: [] },
    { n: "Campari", p: 3, i: "", t: [] },
    { n: "Crodino", p: 3.5, i: "", t: ["zero"] },
    { n: "Cocktail San Pellegrino", p: 3, i: "", t: ["zero"] },
    { n: "Calice di vino", p: 5, i: "", t: [] },
  ]},
  { id: "gintonic", title: "Gin tonic", sub: "Scegli il gin, al resto pensiamo noi", items: [
    { n: "Beefeater", p: 6, i: "London Dry distillato a Londra: ginepro, scorze d'arancia di Siviglia e limone", t: [] },
    { n: "Tanqueray", p: 7, i: "London Dry classico con sole quattro botaniche, il ginepro in primo piano", t: [] },
    { n: "Gin Mare", p: 7, i: "Mediterraneo dalla Spagna: oliva, rosmarino, timo e basilico", t: [] },
    { n: "Roku", p: 7, i: "Giapponese: fiori di sakura, tè sencha, yuzu e pepe sansho", t: [] },
    { n: "Malfy Pompelmo", p: 7, i: "Italiano, fresco e agrumato al pompelmo rosa", t: [] },
    { n: "The East India Company", p: 7, i: "London Dry speziato: pepe lungo, arancia dolce, noce moscata e cacao", t: [] },
    { n: "Hendrick's", p: 8, i: "Scozzese, morbido, con cetriolo e petali di rosa", t: [] },
    { n: "Santa Ana", p: 8, i: "Dalle Filippine: ylang-ylang e agrumi tropicali, floreale e profumato", t: [] },
    { n: "Tavrvs", p: 8, i: "Gin nero torinese con note di pepe nero e zenzero", t: [] },
    { n: "Jrose", p: 9, i: "London Dry artigianale pugliese con etichette di Milo Manara: bergamotto e mandarino", t: [] },
    { n: "Knut Hansen", p: 9, i: "Da Amburgo: ginepro, basilico, cetriolo e mele", t: [] },
    { n: "Saigon Baigur", p: 9, i: "Dal Vietnam: mano di Buddha, fiori di loto e cannella di Saigon", t: [] },
    { n: "Amuerte", p: 11, i: "Belga con foglie di coca peruviane e frutti tropicali, esotico e intenso", t: [] },
  ]},
  { id: "distillati", title: "Rum e whisky", sub: "Lisci o con ghiaccio", list: true, items: [
    { n: "Bacardi Carta Oro", p: 4, g: "Rum", i: "Rum dorato di Porto Rico, morbido, note di vaniglia e caramello", t: [] },
    { n: "Pampero", p: 4, g: "Rum", i: "Rum venezuelano, rotondo, note di caramello e frutta secca", t: [] },
    { n: "Don Papa", p: 5, g: "Rum", i: "Rum delle Filippine, dolce e speziato: vaniglia, miele e frutta candita", t: [] },
    { n: "Matusalem", p: 5, g: "Rum", i: "Rum invecchiato con metodo solera, morbido e avvolgente", t: [] },
    { n: "Jack Daniel's", p: 4, g: "Whiskey", i: "Tennessee whiskey filtrato nel carbone d'acero, morbido e vanigliato", t: [] },
    { n: "Laphroaig 10", p: 6, g: "Whisky", i: "Single malt di Islay, intensamente torbato, affumicato e salmastro", t: [] },
    { n: "Talisker 10", p: 6, g: "Whisky", i: "Single malt dell'isola di Skye: torba, pepe e note marine", t: [] },
    { n: "Knob Creek 9", p: 6, g: "Bourbon", i: "Bourbon del Kentucky invecchiato 9 anni, pieno, caramello e rovere tostato", t: [] },
  ]},
  { id: "amari", title: "Amari e digestivi", sub: "Per chiudere in bellezza", list: true, items: [
    { n: "Anisetta Meletti", p: 3 }, { n: "Varnelli", p: 3 }, { n: "Sambuca Molinari", p: 3 },
    { n: "Amaro Montenegro", p: 3 }, { n: "Vecchio Amaro del Capo", p: 3 }, { n: "Vecchio Amaro del Capo Piccante", p: 3 },
    { n: "Fernet", p: 3 }, { n: "Brancamenta", p: 3 }, { n: "Cynar", p: 3 }, { n: "Unicum", p: 3 },
    { n: "Jägermeister", p: 3 }, { n: "Genziana", p: 3 }, { n: "Vecchia Romagna", p: 3 }, { n: "Baileys", p: 3 },
    { n: "Punch al rum", p: 3 }, { n: "Punch al mandarino", p: 3 }, { n: "Punch al cioccolato", p: 3 },
    { n: "Limoncello", p: 3 }, { n: "Liquirizia", p: 3 },
    { n: "Grappa bianca", p: 4 }, { n: "Grappa barricata", p: 4 },
  ]},
  { id: "spina", title: "Birre alla spina", sub: "Forst Premium bionda o Forst Sixtus rossa doppio malto", items: [
    { n: "Forst", sizes: [["0,2 l", 3], ["0,3 l", 3.5], ["0,4 l", 4.5], ["0,5 l", 5.5], ["1 l", 12]] },
  ]},
  { id: "bottiglia", title: "Birre in bottiglia", sub: "", list: true, items: [
    { n: "Moretti 0,66 l", p: 3.5 }, { n: "Ceres", p: 3.5 }, { n: "Heineken", p: 3.5 }, { n: "Raffo non filtrata", p: 3.5 },
    { n: "Hoegaarden", p: 3.5 }, { n: "Corona", p: 3.5 }, { n: "Corona 0,0", p: 3.5, t: ["zero"] }, { n: "Tennent's", p: 3.5 },
    { n: "Beck's", p: 3 }, { n: "Peroni", p: 3 },
  ]},
  { id: "bibite", title: "Bibite e lattine", sub: "", list: true, items: [
    { n: "Acqua 0,5 l", p: 1 }, { n: "Acqua 1,5 l", p: 2 }, { n: "Sveva", p: 1 },
    { n: "Coca Cola", p: 2.5 }, { n: "Fanta", p: 2.5 }, { n: "Sprite", p: 2.5 }, { n: "Tè pesca o limone, lattina", p: 2.5 },
    { n: "Estathé", p: 1.5 }, { n: "Red Bull", p: 3 }, { n: "Cedrata", p: 3 }, { n: "Chinotto", p: 3 },
    { n: "Acqua tonica", p: 3 }, { n: "Soda al limone", p: 3 }, { n: "Ginger beer", p: 3 },
  ]},
];
const fmt = p => p == null ? "" : (Number.isInteger(p) ? String(p) : p.toFixed(2).replace(".", ","));

const TAG_LABEL ={ zero: "analcolico", forte: "forte" };
const menuEl = document.getElementById("menu");
const chipsEl = document.getElementById("chips");
const q = document.getElementById("q");
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function render() {
  menuEl.innerHTML = MENU.map(sec => `
    <section id="${sec.id}" data-sec>
      <h2>${esc(sec.title)} <span class="n">${String(sec.items.length).padStart(2, "0")}</span></h2>
      ${sec.sub ? `<p class="sub">${esc(sec.sub)}</p>` : ""}
      <div class="${sec.list ? "list" : ""}">
        ${sec.items.map(it => `
          <article class="item" data-text="${esc((it.n + " " + (it.i || "") + " " + (it.g || "") + " " + (it.t || []).join(" ")).toLowerCase())}">
            <div class="top"><h3>${esc(it.n)}</h3><span class="dots"></span>${it.p != null ? `<span class="price">${fmt(it.p)}</span>` : ""}</div>
            ${(it.g || it.i) ? `<p class="ing">${it.g ? `<span class="glass">${esc(it.g)}</span>` : ""}${it.g && it.i ? " · " : ""}${esc(it.i || "")}</p>` : ""}
            ${it.sizes ? `<div class="sizes">${it.sizes.map(([l, p]) => `<div class="size"><span>${l}</span><span class="price">${fmt(p)}</span></div>`).join("")}</div>` : ""}
            ${it.note ? `<p class="note">${esc(it.note)}</p>` : ""}
            ${(it.t || []).length ? `<div class="tags">${it.t.map(t => `<span class="tag ${t === "zero" ? "zero" : t === "forte" ? "strong" : ""}">${TAG_LABEL[t] || t}</span>`).join("")}</div>` : ""}
          </article>`).join("")}
      </div>
    </section>`).join("");

  chipsEl.innerHTML = `<button class="chip" id="chip-all" aria-pressed="true" data-target="all">Tutto</button>` +
    MENU.map(s => `<button class="chip" id="chip-${s.id}" aria-pressed="false" data-target="${s.id}">${esc(s.title)}</button>`).join("");
}

let active = "all";
function apply() {
  const term = q.value.trim().toLowerCase();
  let shown = 0;
  document.querySelectorAll("[data-sec]").forEach(sec => {
    const secOk = active === "all" || sec.id === active;
    let visible = 0;
    sec.querySelectorAll(".item").forEach(it => {
      const ok = secOk && (!term || it.dataset.text.includes(term));
      it.classList.toggle("hidden", !ok);
      if (ok) visible++;
    });
    sec.classList.toggle("hidden", visible === 0);
    shown += visible;
  });
  document.getElementById("empty").style.display = shown ? "none" : "block";
}

render();
chipsEl.addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  active = b.dataset.target;
  chipsEl.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", String(c === b)));
  apply();
  window.scrollTo({ top: 0 });
});
q.addEventListener("input", apply);
apply();
</script>
</body>
</html>
